name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Same self-hosted target as pull-request.yml's docker-build job — see
    # that file's comment for why `phronex-main-host` (not `phronex-main` /
    # `vars.PHRONEX_CI_RUNNER`) is the correct label for this repo, which has
    # no LXD container runner provisioned.
    runs-on: [self-hosted, phronex-main-host]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # See pull-request.yml's docker-build job for the full rationale on this
    # ACL grant (socket-scoped, runtime-only, narrower than the persistent
    # `docker` group membership removed 2026-08-21).
    - name: Grant this runner user access to the Docker socket
      run: sudo setfacl -m user:$(whoami):rw /var/run/docker.sock

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max